[project]
name = "lorerunes"
version = "0.1.0"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
description = "Shared stdlib-only primitives for the lore project — the runes a sigil is composed from."
# INTENTIONALLY EMPTY, AND IT IS THE WHOLE CONSTRAINT (CLAUDE.md, `lorerunes` —
# THE HOME FOR SHARED CODE). This member depends on NO sibling, ever: the moment
# it imports `loremaster` or `loresigil` it stops being importable BY them, and
# the shared home is back to being nowhere. A third-party dependency added here
# is inherited by every other member, so it is a design decision, not a tidying.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lorerunes"]
