# pending_contracts.yaml — the ACCEPTED, PENDING-BUILD bounds of this repo's
# canonical gates. Read by scripts/pending_contract_gate.py, which DENIES BY
# DEFAULT: every gate line must be accounted for here, or the gate fails loud.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS FILE IS, AND WHAT IT IS NOT
# ─────────────────────────────────────────────────────────────────────────────
# It is NOT a suppression list. Nothing here silences anything: the plain gates
# still run unchanged, every error they emit is still printed, and this file only
# decides which of them have already been ADJUDICATED. An entry buys a specific
# error in a specific file naming a specific symbol — nothing wider.
#
# It is the PIN on an accepted bound, per this repo's standing law: "an unpinned
# known limitation is indistinguishable from an unknown one", and "per standing
# law, an accepted bound is PINNED, never prose". Finding #306 is the diagnosis;
# this file is the instrument.
#
# ⚠ IT SELF-DESTRUCTS. A registered file that stops erroring, a registered symbol
# that stops appearing, a symbol that becomes importable, or a code allowance
# whose count moves — each one FAILS the gate until the entry is deleted with the
# fix. The bound cannot outlive its premise. If you are reading this because the
# gate told you to delete something: that is the instrument working. Delete it.
#
# ─────────────────────────────────────────────────────────────────────────────
# DERIVATION — what below is measured, and what is a ruling
# ─────────────────────────────────────────────────────────────────────────────
# DERIVED, by `uv run python scripts/pending_contract_gate.py --derive` against a
# live `./scripts/typecheck.sh` run at commit 533d917 (2026-08-01):
#   * the file set, the per-file `missing_symbols` set, the per-file
#     `unsymboled_codes` counts.
# Re-derive rather than hand-editing; a hand-list is the artifact this repo has
# the most receipts against.
#
# HAND-AUTHORED, because no script can derive an adjudication:
#   * `owner`, `reopen_trigger`, `ruling`, `rationale`, and each allowance's
#     `reason`. These are facts about a DECISION, not about the tree.
#
# ⚠ AND ONE DELIBERATE OMISSION, so the next reader meets it rather than
# discovering it. The same 533d917 run showed a TWELFTH red file,
# `loremaster/tests/test_comms_footer.py` (7 errors) — packet 04b-2 wave C's OWN
# C3 contract, committed RED ahead of a build that is IN FLIGHT THIS WAVE, not
# blocked on anything. It is deliberately NOT registered: its build discharges it
# within the wave, so an entry would be a stale exemption from the hour it was
# written, and adjudicating a bound is the lead's authority, not a builder's.
# Until that build lands, this gate FAILS naming that file — which is the honest
# state, and is itself a live demonstration that deny-by-default works.
#
# ─────────────────────────────────────────────────────────────────────────────
# MEASUREMENT, dated because an archived number reads as current
# ─────────────────────────────────────────────────────────────────────────────
# At 533d917 (2026-08-01), `./scripts/typecheck.sh` reported 198 errors over 12
# files, merged across its legs: `Found 89 errors in 3 files` (lorerunes leg) and
# `Found 109 errors in 9 files` (loremaster leg). 191 of those are the 11 files
# below; 7 are the unregistered C3 contract named above.
#
# ⚠ That total differs from finding #306's headline "102 errors in 8 files", and
# the difference is NOT drift: 102 is the LOREMASTER LEG'S OWN summary line,
# quoted beside an 11-file table that sums to 191. The merged total at 04ede45
# was 191; at 533d917 it is 198 because C3's contract landed in between. Re-derive
# before citing either number.
#
# Error codes at 533d917: 190 attr-defined, 4 call-arg, 4 no-any-unimported. The
# ruling's "every error is attr-defined" was true of the sample read, not of the
# set — which is why `unsymboled_codes` exists at all (see below).

version: 1

bounds:
  - id: packet-39-pending-build
    owner: >-
      packet 39 — the hosted-security contract. Owner of the CLOSURE is packet 39;
      owner of this PIN is packet 04b-2 wave C.
    reopen_trigger: >-
      operator decision #296, or packet 39's build start — whichever comes first.
      At that point every entry below self-destructs as its file goes green.
    ruling: >-
      finding #306 (the diagnosis and the ruling text), from packet 04b-2 wave C's
      design sidecar ruling 4, thread q:04b2-gate-definition. Rejected alternatives
      A–F are recorded there: scope-exclusion, literal-blocked-deploy, per-line
      type: ignore, re-authoring the contract, hand-diffing at deploy time, and
      reverting the contract commit.
    rationale: >-
      These 11 files are a TEST CONTRACT committed deliberately ahead of a build
      that is BLOCKED on operator decision #296, after four adversary passes all
      returning INSUFFICIENT and an operator override holding the door. They are
      operator-held territory: the clean closure (build it, or re-author it to the
      mypy-clean house idiom) lives inside files this wave may not touch. This is
      the out-of-authority deferral shape, with a named decision point — not
      unfixed work. Every error below is a reference to a symbol packet 39's build
      will CREATE; none is a defect in shipped code.

    files:
      - path: loremaster/tests/_auth_fixtures.py
