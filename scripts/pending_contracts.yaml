          - lorerunes.SCOPE_WRITE
          - lorerunes.derive_posture
        unsymboled_codes:
          # THE RULING'S FALSIFIER (b), INVOKED. Per-symbol discrimination is
          # unbuildable for these two: mypy's message is `Return type becomes
          # "Any | None" due to an unfollowed import` — it names the DECAYED
          # SIGNATURE, never the missing symbol that caused the decay, so there is
          # no name to register. The residual is stated as required: file-exact,
          # code-exact, and COUNT-exact. A third one is a change in the world and
          # must be re-adjudicated, not absorbed.
          #
          # RESIDUAL, said plainly: while this entry stands, a genuinely NEW
          # `no-any-unimported` error in this file would be admitted if and only if
          # it replaced one of these two — the count cannot tell them apart. That
          # is the price of falsifier (b), it is bounded at 2 lines in 1 file, and
          # it discharges at packet 39's build.
          - code: no-any-unimported
            count: 2
            reason: >-
              downstream of the unfollowed `lorerunes` import; the message names a
              decayed return type, not a missing symbol.

