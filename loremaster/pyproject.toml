[project]
name = "loremaster"
version = "0.1.0"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
description = "Orchestration layer: MCP server backed by SurrealDB for the lore project."
dependencies = [
    "lorerunes",
    "lorescribe",
    "loresigil",
    # DIRECT, not inherited: the trace seam shields its emission with
    # ``anyio.CancelScope(shield=True)``. anyio arrives transitively via mcp, but
    # production code that IMPORTS a package declares it — a transitive pin is
    # somebody else's promise to keep.
    "anyio>=4.5",
    "mcp[cli]>=1.27",
    "watchdog>=6.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "pyyaml>=6.0.2",
    # DECLARED, not inherited (ruling R2): ``config.resolve_secret`` imports
    # ``dotenv_values`` to parse an operator ``.env``. It currently resolves only
    # as a TRANSITIVE dependency of pydantic-settings, and a transitive pin is
    # somebody else's promise to keep.
    "python-dotenv>=1.2",
    "surrealdb>=2.0",
    "httpx>=0.28",
    "python-ulid>=4.0.1",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "kubernetes>=36.0.3",
    # DIRECT, not inherited — same rule as anyio above, and load-bearing in a way
    # anyio is not: ``orjson.dumps(..., OPT_SORT_KEYS)`` is the canonical pre-image
    # of ``head_identity``, which MINTS A RECORD IDENTITY. It arrived here only
    # transitively before packet 11-i-a. An identity frozen in the store must never
    # rest on a version somebody else's dependency happens to resolve.
    "orjson>=3.11",
]

[tool.uv.sources]
lorerunes = { workspace = true }
lorescribe = { workspace = true }
loresigil = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "networkx>=3.6.1",
]

[tool.hatch.build.targets.wheel]
packages = ["loremaster"]
