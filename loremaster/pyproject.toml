[project]
name = "loremaster"
version = "0.1.0"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
description = "Orchestration layer: MCP server backed by SurrealDB for the lore project."
dependencies = [
    "lorerunes",
    "lorescribe",
    "loresigil",
    # DIRECT, not inherited: the trace seam shields its emission with
    # ``anyio.CancelScope(shield=True)``. anyio arrives transitively via mcp, but
    # production code that IMPORTS a package declares it — a transitive pin is
    # somebody else's promise to keep.
    "anyio>=4.5",
    # Packet 59: the MCP server façade is standalone ``fastmcp`` 3.x. ``mcp`` rides
    # TRANSITIVELY via ``fastmcp-slim``'s ``mcp<2.0,>=1.24.0`` pin (D4, operator-ruled):
    # ``mcp.types`` (ContentBlock/ToolAnnotations) stays a direct import, undeclared —
    # operator-ACCEPTED. ``fastmcp`` (the umbrella = ``fastmcp-slim[client,server]``) is
    # correct; lore needs no opt-in extras (design §3 packaging).
    "fastmcp>=3.4,<4",
    "watchdog>=6.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "pyyaml>=6.0.2",
    # DECLARED, not inherited (ruling R2): ``config.resolve_secret`` imports
    # ``dotenv_values`` to parse an operator ``.env``. It currently resolves only
    # as a TRANSITIVE dependency of pydantic-settings, and a transitive pin is
    # somebody else's promise to keep.
    "python-dotenv>=1.2",
    "surrealdb>=2.0",
    "httpx>=0.28",
    "python-ulid>=4.0.1",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "kubernetes>=36.0.3",
    # DIRECT, not inherited — same rule as anyio above, and load-bearing in a way
    # anyio is not: ``orjson.dumps(..., OPT_SORT_KEYS)`` is the canonical pre-image
    # of ``head_identity``, which MINTS A RECORD IDENTITY. It arrived here only
    # transitively before packet 11-i-a. An identity frozen in the store must never
    # rest on a version somebody else's dependency happens to resolve.
    "orjson>=3.11",
    "cachetools>=5",
    # RUNTIME as of #273/#272 (packet 04b-3): ``tasks.py::_record_legacy_cycles`` swaps its
    # hand-rolled all-cycle enumeration for ``networkx.simple_cycles`` (packages over
    # hand-rolling; a hand-roll undercounts a fully-connected component 4-vs-5). It is now a
    # PRODUCTION import of the served artifact — moved here from the dev group so the image's
    # ``uv sync --locked --all-packages`` bakes it in (the #131/#139 in-image class). The
    # ``[[tool.mypy.overrides]]`` block for networkx in the ROOT pyproject is re-scoped to
    # production accordingly.
    "networkx>=3.6.1",
]

[tool.uv.sources]
lorerunes = { workspace = true }
lorescribe = { workspace = true }
loresigil = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loremaster"]
