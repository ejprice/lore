[project]
name = "loremaster"
version = "0.1.0"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
description = "Orchestration layer: MCP server backed by SurrealDB for the lore project."
dependencies = [
    "lorescribe",
    "loresigil",
    # DIRECT, not inherited: the trace seam shields its emission with
    # ``anyio.CancelScope(shield=True)``. anyio arrives transitively via mcp, but
    # production code that IMPORTS a package declares it — a transitive pin is
    # somebody else's promise to keep.
    "anyio>=4.5",
    "mcp[cli]>=1.27",
    "watchdog>=6.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "pyyaml>=6.0.2",
    "surrealdb>=2.0",
    "httpx>=0.28",
    "python-ulid>=4.0.1",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "kubernetes>=36.0.3",
]

[tool.uv.sources]
lorescribe = { workspace = true }
loresigil = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loremaster"]
