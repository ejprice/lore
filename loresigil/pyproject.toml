[project]
name = "loresigil"
version = "0.1.0"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
description = "Voyage AI embedding and tokenization for the lore project."
# voyage4_tokenizer.json sha256: c0382117ea329cdf097041132f6d735924b697924d6f6fc3945713e96ce87539
# Source: voyageai/voyage-4-nano (byte-identical to voyage-4-large) from HF cache.
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.13",
    # Full-jitter exponential backoff (loresigil.backoff): tenacity's
    # wait_random_exponential is the AWS "Full Jitter" algorithm, tested upstream.
    # DECLARED, not inherited — tenacity was already resolvable in this workspace
    # only as a TRANSITIVE dependency of langchain-core (pulled in by lorescribe's
    # langchain-text-splitters). Production code importing it on that basis breaks
    # the day that chain drops it, with nothing in our own metadata to prevent it.
    "tenacity>=9.0",
    "tokenizers>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loresigil"]

[tool.hatch.build.targets.wheel.shared-data]
"loresigil/data" = "loresigil/data"
