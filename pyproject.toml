[project]
name = "lore-workspace"
version = "0.0.0"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
# Root is a virtual/non-package workspace root — no source distribution.

[tool.uv]
package = false

[tool.uv.workspace]
members = ["lorerunes", "lorescribe", "loresigil", "loremaster"]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "ruff",
    "pytest",
    "pytest-asyncio",
    # Parallel test execution (`-n auto`). The live-store harness was ALREADY built for
    # this: `_surreal_harness.unique_database()` mints `test_<pid>_<uuid4>` per test, and
    # its own docstring says the pid prefix means "a concurrent pytest process on the SAME
    # server never collides on, or reaps, this database". The runner was simply missing.
    "pytest-xdist",
    "types-defusedxml",
    "types-PyYAML",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py314"
# Session debris under scratchpad/ is untracked and not part of the workspace
# packages; dist/ is already skipped via .gitignore-derived defaults.
#
# docs/plans/v2/receipts/ carries ARCHIVED probe scripts and wave reports — the
# instruments behind measured numbers this repo serves (#152/#153). They are
# preserved BYTE-FAITHFUL to what was actually run, because a receipt that has
# been reformatted is no longer evidence of the run it documents. Linting them
# would mean editing them, so they are excluded rather than fixed. They are
# archived artifacts, never maintained source: nothing imports them, and a
# change to one is a falsification, not a refactor.
extend-exclude = ["scratchpad", "docs/plans/v2/receipts"]

[tool.ruff.lint]
# The "pylint gate" is ruff's PL family (real pylint is upstream-blocked on
# astroid<4.1 — do not suggest installing it). Curation is operator-ruled
# 2026-07-05: PLC0415 (lazy imports) and PLR0913 (too-many-arguments) are
# ignored tree-wide as deliberate house idioms; PLR2004 (magic-value-comparison)
# stays live for production code but is per-file-ignored for tests/scripts/
# skills/docs below. Every other PL rule is enabled tree-wide.
select = ["E", "F", "I", "UP", "PL"]
ignore = ["PLC0415", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]
"**/test_*.py" = ["PLR2004"]
"scripts/**" = ["PLR2004"]
"skills/**" = ["PLR2004"]
"docs/**" = ["PLR2004"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_unimported = true
# ``loremaster/tests`` and ``loresigil/tests`` are on the path so their shared
# test-helper modules (``_extension_helpers``, ``_contextualized_fixtures``) —
# imported as plain top-level modules under ``--import-mode=importlib`` (see
# each member's ``tests/conftest.py``) — resolve statically for mypy as well
# as at runtime.
mypy_path = "lorerunes:lorescribe:loresigil:loremaster:loremaster/tests:loresigil/tests"
explicit_package_bases = true
namespace_packages = true
#
# CANONICAL TYPECHECK — run ``scripts/typecheck.sh`` (NOT a single combined
# ``mypy`` over several members).  Each member owns a ``tests/`` directory; under
# ``explicit_package_bases`` they all map to the same ``tests.*`` namespace, so
# passing several members in ONE invocation trips a spurious "Duplicate module
# named tests.conftest" error.  The runner issues one
# mypy invocation PER member — each has a single ``tests/`` in scope, so there is
# no collision and every member's src AND tests are actually type-checked.

# astroid ships no type stubs and no ``py.typed`` marker, so under
# ``disallow_any_unimported`` every astroid node would surface as a blocking
# ``no-any-unimported`` error. ``astroid_parse`` is the single, deliberate
# astroid boundary in the codebase — it reduces astroid nodes to fully-typed
# value objects so nothing astroid-shaped escapes it — so the unimported-Any
# relaxation is scoped to exactly that module rather than weakened globally.
[[tool.mypy.overrides]]
module = ["lorescribe.astroid_parse"]
disallow_any_unimported = false

# astroid itself has no stubs; let mypy follow it as untyped (its symbols
# become ``Any``) so importing it is not a hard error inside the boundary module.
[[tool.mypy.overrides]]
module = ["astroid", "astroid.*"]
follow_untyped_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
# Let importlib mode resolve the installed namespace packages (loresigil,
# lorescribe, …) instead of shadowing them with the on-disk distribution dirs,
# so test modules can import the package submodules under test.
consider_namespace_packages = true
testpaths = [
    "lorerunes/tests",
    "lorescribe/tests",
    "loresigil/tests",
    "loremaster/tests",
    # ``scripts/`` carries the GUARDS — tree_fingerprint (#192, "which tree did
    # that gate result describe?") and mutation_proof (#196, "did the pin
    # actually fire?"). Until 2026-07-25 they were outside testpaths, so neither
    # ran in the standard gate and both were only as green as someone
    # remembering ``pytest scripts/``.
    #
    # A GUARD NOBODY RUNS IS A HOPE WITH A FILENAME — the exact class these two
    # files exist to instrument, with the two instruments as its victims. They
    # are lead/agent tooling rather than shipped code, which is why they were
    # never added; but tooling that silently rots is worse than no tooling,
    # because its presence is read as coverage.
    #
    # NOTE: this adds the PYTEST gate only. ``scripts/`` is still outside
    # ``scripts/typecheck.sh`` (#188 measured 41 mypy errors there) — a separate
    # work item, deliberately not conflated with this one.
    "scripts",
]
